# Blueprint Render — version 100% GRATUITE : https://render.com/docs/blueprint-spec
#
# Crée deux services aux noms volontairement uniques (pour ne pas entrer
# en collision avec d'éventuels services existants du compte) :
#   - chatbot-vocal-api : API Flask en Docker (plan Free, Vosk + Whisper)
#   - chatbot-vocal-app : site statique React (gratuit, HTTPS compris)
#
# Le plan Free n'a pas de disque persistant : la base est hébergée
# gratuitement sur Neon (PostgreSQL). Voir docs/DEPLOIEMENT-GRATUIT.md.
#
# Contreparties du gratuit : le serveur s'endort après 15 min d'inactivité
# (premier accès suivant ~30-60 s de réveil) ; les fichiers d'export Word/
# PDF/TXT sont régénérés à la demande (déjà géré par le backend).

services:
  # -----------------------------------------------------------------
  # API (temps réel, transcription)
  # -----------------------------------------------------------------
  - type: web
    name: chatbot-vocal-api
    runtime: docker
    branch: arena/01a08aa8-chatbot
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: DATA_DIR
        value: /app/data
      - key: DEFAULT_ENGINE
        value: vosk
      - key: DEFAULT_LANGUAGE
        value: fr
      # Modèle préchargé dans l'image. Sur le plan gratuit (512 Mo de RAM),
      # si Whisper fait redémarrer le serveur, passez à "tiny" (le modèle
      # est alors téléchargé au premier usage) : Vosk reste pleinement
      # fonctionnel dans tous les cas.
      - key: WHISPER_MODEL_SIZE
        value: base
      - key: WHISPER_DEVICE
        value: cpu
      - key: WHISPER_COMPUTE_TYPE
        value: int8
      # Base PostgreSQL gratuite Neon : collez la chaîne de connexion
      # fournie par Neon (elle commence par postgresql://...).
      # Indispensable pour conserver comptes et transcriptions sur le
      # plan gratuit à disque éphémère.
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://chatbot-vocal-app.onrender.com
      # Votre adresse e-mail pour obtenir le rôle administrateur dès
      # l'inscription (peut rester vide).
      - key: ADMIN_EMAILS
        sync: false
      # Optionnel : analyse LLM (OpenAI ou Ollama exposé publiquement)
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      # Optionnel : envoi d'e-mails SMTP
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

  # -----------------------------------------------------------------
  # Frontend (site statique, gratuit)
  # -----------------------------------------------------------------
  - type: web
    name: chatbot-vocal-app
    runtime: static
    branch: arena/01a08aa8-chatbot
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    # La variable REACT_APP_* est gravée dans le build : l'URL doit être
    # celle de l'API ci-dessus.
    envVars:
      - key: REACT_APP_API_URL
        value: https://chatbot-vocal-api.onrender.com
    # Routage SPA : toute URL inconnue renvoie index.html
    # (nécessaire pour les liens de partage /shared/<token>)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
